workers:
  - name: iii-worker-manager
    config:
      port: 49134
      host: 127.0.0.1

  - name: iii-state
    config:
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: ./data/state_store.db

  - name: iii-http
    config:
      port: 3111
      host: 127.0.0.1
      cors:
        allowed_origins: ["*"]

  - name: iii-pubsub
    config:
      adapter:
        name: local

  - name: iii-cron
    config:
      adapter:
        name: kv

  - name: iii-observability
    config:
      enabled: true
      service_name: n-autoresearch
      service_version: "0.1.0"
      exporter: memory
