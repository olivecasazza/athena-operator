name: Build and publish Athena Console

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/athena-operator-status

jobs:
  build-publish:
    name: Build console image, push to GAR
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          registry="us-central1-docker.pkg.dev"
          image_repo="${registry}/casazza-compute/nixlab/athena-console"
          tag="sha-${short_sha}"
          {
            echo "registry=${registry}"
            echo "image_repo=${image_repo}"
            echo "tag=${tag}"
            echo "image=${image_repo}:${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        shell: bash
        run: gcloud auth configure-docker "${{ steps.meta.outputs.registry }}" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Athena Console image
        uses: docker/build-push-action@v6
        with:
          context: athena-console
          file: athena-console/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_repo }}:latest
