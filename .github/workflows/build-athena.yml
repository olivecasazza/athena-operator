name: Build and publish Athena

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/athena-operator-status

jobs:
  build-publish:
    name: Build image and update chart
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          registry="us-central1-docker.pkg.dev"
          image_repo="${registry}/casazza-compute/nixlab/athena"
          tag="sha-${short_sha}"
          {
            echo "registry=${registry}"
            echo "image_repo=${image_repo}"
            echo "tag=${tag}"
            echo "image=${image_repo}:${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        shell: bash
        run: gcloud auth configure-docker "${{ steps.meta.outputs.registry }}" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Athena image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.athena
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_repo }}:latest

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update Helm chart image tag
        shell: bash
        env:
          IMAGE_REPO: ${{ steps.meta.outputs.image_repo }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          CHART_PATH: charts/athena
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          chart = Path(os.environ["CHART_PATH"])
          values = chart / "values.yaml"
          chart_yaml = chart / "Chart.yaml"
          image_repo = os.environ["IMAGE_REPO"]
          image_tag = os.environ["IMAGE_TAG"]
          lines = values.read_text().splitlines()
          in_image = False
          for i, line in enumerate(lines):
              if line == "image:":
                  in_image = True
                  continue
              if in_image and line and not line.startswith(" "):
                  in_image = False
              if in_image and line.strip().startswith("repository:"):
                  lines[i] = f"  repository: {image_repo}"
              if in_image and line.strip().startswith("pullPolicy:"):
                  lines[i] = "  pullPolicy: Always"
              if in_image and line.strip().startswith("tag:"):
                  lines[i] = f'  tag: "{image_tag}"'
          values.write_text("\n".join(lines) + "\n")
          chart_lines = chart_yaml.read_text().splitlines()
          for i, line in enumerate(chart_lines):
              if line.startswith("appVersion:"):
                  chart_lines[i] = f'appVersion: "{image_tag}"'
          chart_yaml.write_text("\n".join(chart_lines) + "\n")
          PY

      - name: Lint Helm chart
        run: helm lint charts/athena

      - name: Render Helm chart
        run: helm template athena-operator charts/athena > /tmp/athena-rendered.yaml

      - name: Commit chart tag update
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- charts/athena/Chart.yaml charts/athena/values.yaml; then
            echo "Chart already points at ${IMAGE_TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/athena/Chart.yaml charts/athena/values.yaml
          git commit -m "ci(chart): publish Athena image ${IMAGE_TAG}"
          git push
