name: Publish

on:
  push:
    branches:
      - main
      - feat/athena-operator-status
  workflow_dispatch:

jobs:
  build-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute meta
        id: meta
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "repo=us-central1-docker.pkg.dev/casazza-compute/nixlab/athena-console" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: athena-console
          file: athena-console/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}:latest

  build-operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute meta
        id: meta
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "repo=us-central1-docker.pkg.dev/casazza-compute/nixlab/athena" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.athena
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}:latest
      - uses: azure/setup-helm@v4
      - name: Update Helm chart image tag
        env:
          IMAGE_REPO: ${{ steps.meta.outputs.repo }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          CHART_PATH: charts/athena
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          chart = Path(os.environ["CHART_PATH"])
          values = chart / "values.yaml"
          chart_yaml = chart / "Chart.yaml"
          image_repo = os.environ["IMAGE_REPO"]
          image_tag = os.environ["IMAGE_TAG"]
          lines = values.read_text().splitlines()
          in_image = False
          for i, line in enumerate(lines):
              if line == "image:":
                  in_image = True
                  continue
              if in_image and line and not line.startswith(" "):
                  in_image = False
              if in_image and line.strip().startswith("repository:"):
                  lines[i] = f"  repository: {image_repo}"
              if in_image and line.strip().startswith("pullPolicy:"):
                  lines[i] = "  pullPolicy: Always"
              if in_image and line.strip().startswith("tag:"):
                  lines[i] = f'  tag: "{image_tag}"'
          values.write_text("\n".join(lines) + "\n")
          chart_lines = chart_yaml.read_text().splitlines()
          for i, line in enumerate(chart_lines):
              if line.startswith("appVersion:"):
                  chart_lines[i] = f'appVersion: "{image_tag}"'
          chart_yaml.write_text("\n".join(chart_lines) + "\n")
          PY
      - run: helm lint charts/athena
      - run: helm template athena-operator charts/athena > /tmp/athena-rendered.yaml
      - name: Commit chart update
        run: |
          if git diff --quiet -- charts/athena/Chart.yaml charts/athena/values.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/athena/Chart.yaml charts/athena/values.yaml
          git commit -m "ci(chart): publish Athena image ${{ steps.meta.outputs.tag }}"
          git push
