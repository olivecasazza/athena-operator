[workspace]
resolver = "2"
members = [
    "crates/athena",
    "crates/athena-api",
    "crates/athena-console",
    "crates/athena-console-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/olivecasazza/athena-operator"

[workspace.dependencies]
athena-api = { path = "crates/athena-api" }
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.31"
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", features = ["grpc-tonic", "metrics", "trace"] }
opentelemetry-semantic-conventions = "0.30"
thiserror = "2"
futures = "0.3"
anyhow = "1"
prometheus = "0.13"
axum = "0.7"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
iced = { version = "0.13", default-features = false, features = ["tokio", "tiny-skia", "fira-sans", "highlighter"] }
