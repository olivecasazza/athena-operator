---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: athena-workspace
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
apiVersion: research.nixlab.io/v1alpha1
kind: RuntimeProfile
metadata:
  name: hp-8gb-canary
spec:
  runtime:
    type: pytorch
    mode: batchJob
  image: "python:3.11-slim"
  command:
    - sh
    - -c
    - |
      set -eu;
      echo '[canary] runtime image smoke';
      python - <<'PY'
      import json
      import os
      import pathlib
      import time

      metrics_path = os.environ.get("ATHENA_METRICS_PATH") or "/workspace/metrics.json"
      path = pathlib.Path(metrics_path)
      if not path.is_absolute():
          path = pathlib.Path(os.environ.get("ATHENA_WORKSPACE_PATH", "/workspace")) / path
      path.parent.mkdir(parents=True, exist_ok=True)

      experiment = json.loads(os.environ.get("ATHENA_EXPERIMENT_SPEC", "{}"))
      params = experiment.get("parameters", {})
      baseline = float(params.get("baselineValBpb", 8.5))
      iteration = int(params.get("experimentIteration", 0))
      val_bpb = 1.0
      metrics = {
          "status": "completed",
          "optimizer_steps": 1,
          "val_bpb": val_bpb,
          "val_bpb_delta": baseline - val_bpb,
          "baseline_val_bpb": baseline,
          "training_seconds": 0.1,
          "peak_vram_mb": 0.0,
          "experiment_iteration": iteration,
          "experiment_tag": params.get("experimentTag", "karpathy-canary"),
          "parent_experiment_id": params.get("parentExperimentId"),
          "timestamp": time.time(),
      }
      path.write_text(json.dumps(metrics, indent=2))
      print(path)
      print(json.dumps(metrics, indent=2))
      PY
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      nvidia.com/gpu: "1"
  storage:
    workspaceClaimName: "athena-workspace"
    workspaceMountPath: "/workspace"
    createWorkspaceClaim: true
    workspaceSize: 10Gi
    workspaceStorageClassName: longhorn
  scheduling:
    nodeSelector:
      kubernetes.io/hostname: contra
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  # This smoke canary exits fast and does not run the athena_metrics helper, so
  # it opts OUT of live scraping to avoid a down PodMonitor target. Real
  # training profiles leave metricsEndpoint at its default (enabled: true) and
  # use experiments/athena_metrics.py to expose /metrics on :9108; set
  # prometheusQueryUrl there to also enable in-job display retrieval, e.g.
  #   prometheusQueryUrl: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
  metricsEndpoint:
    enabled: false
---
apiVersion: research.nixlab.io/v1alpha1
kind: ExperimentTemplate
metadata:
  name: canary-template
spec:
  runtimeProfileRef: hp-8gb-canary
  source:
    git:
      url: "https://github.com/olivecasazza/athena-operator"
      ref: "main"
  objective:
    metric: "val_bpb"
    goal: "minimize"
  metrics:
    parser:
      type: "file"
      path: "metrics.json"
  defaults:
    experimentTag: "karpathy-canary"
    experimentIteration: 2
    parentExperimentId: "canary-run-01"
    baselineValBpb: 8.5
  parameterSchema:
    depth:
      type: integer
      default: 2
    deviceBatchSize:
      type: integer
      default: 4
    totalBatchSize:
      type: integer
      default: 1024
    timeBudget:
      type: integer
      default: 15
    experimentTag:
      type: string
      default: "karpathy-canary"
      description: "Logical Karpathy-style experiment tag used to compare a series of runs."
    experimentIteration:
      type: integer
      default: 2
      description: "Monotonic iteration ID within experimentTag."
    parentExperimentId:
      type: string
      default: "canary-run-01"
      description: "Previous/baseline Experiment ID used for lineage."
    baselineValBpb:
      type: number
      default: 8.5
      description: "Previous best validation BPB; lower final val_bpb is an improvement."
  dashboard:
    title: "Canary Run Dashboard"
    metrics:
      val_bpb:
        label: "Validation BPB"
        goal: minimize
        description: "Final validation BPB for this iteration."
      val_bpb_delta:
        label: "BPB improvement"
        goal: maximize
        baseline: 0
        description: "baselineValBpb - val_bpb; positive means this iteration improved."
      experiment_iteration:
        label: "Iteration"
      peak_vram_mb:
        label: "Peak VRAM (MB)"
---
apiVersion: research.nixlab.io/v1alpha1
kind: ResearchCampaign
metadata:
  name: canary-campaign
spec:
  templateRef: canary-template
  concurrency: 1
  budget:
    maxExperiments: 1
    maxDuration: "10m"
---
apiVersion: research.nixlab.io/v1alpha1
kind: Experiment
metadata:
  name: canary-run-02
spec:
  campaignRef: canary-campaign
  hypothesis: "Canary test using minimal depth and 15s budget to exercise operator and autoscaler."
  parameters:
    depth: 2
    deviceBatchSize: 4
    totalBatchSize: 1024
    timeBudget: 15
    experimentTag: "karpathy-canary"
    experimentIteration: 2
    parentExperimentId: "canary-run-01"
    baselineValBpb: 8.5
