# Controlled test of WHY spot scores 0.000 on stance.
#
# Observation across 5 recorded spot stance experiments (GPU and CPU branches
# alike): eval_upright_frac 0.766-0.832 with eval_fall_rate 1.00. A toppling
# robot's upright_cos collapses, so a robot that is upright ~80% of steps and
# still terminates every episode is being ended by the OTHER termination branch:
#
#   height = float(pos[1])                              # ABSOLUTE world Y
#   sag_allowance = max(0.05, 0.4 * self._stand_height)
#   fallen = upright < 0.3 or height < self._stand_height - sag_allowance
#
# _stand_height is sampled ONCE at reset after 10 settle steps, then compared
# against absolute height for the whole episode. Two ways that misfires:
#   (a) terrain -- spawn jitter puts the robot on heightfield geometry, and any
#       settling or sliding to lower ground drops absolute Y while the robot is
#       perfectly upright;
#   (b) settling -- 10 steps may not settle a 3 kg quadruped, so _stand_height
#       is captured mid-descent, leaving the threshold above the true resting
#       height and guaranteeing termination.
#
# Spot is statically stable on four legs. Failing to stand in 100% of episodes
# is the anomaly this campaign is meant to explain, and the drive's own
# proposal-6 independently flagged it as a suspected termination bug.
#
# Runs on the CPU template so it uses tyan01's otherwise-idle slot rather than
# taking an RTX 4000 from the curriculum drive (0.86x throughput; see the
# tyan01-cpu-capacity report).
apiVersion: research.nixlab.io/v1alpha1
kind: ResearchCampaign
metadata:
  name: spot-stance-fall-detector
  namespace: apps
  labels:
    research.nixlab.io/curriculum-robot: spot
    research.nixlab.io/curriculum-stage: stance
    research.nixlab.io/purpose: defect
spec:
  templateRef: curriculum-spot-stance-cpu
  concurrency: 1
  strategy:
    type: heuristic
  budget:
    maxExperiments: 2
    maxDuration: 8h
  # Self-documenting: this campaign is standalone (no drive owns it), so
  # without a proposer it would terminate leaving only raw metrics and whatever
  # a human remembered to write. The operator authors the ResearchReport on
  # terminal phase instead.
  proposer:
    endpoint: http://omniroute.apps.svc.cluster.local:20128/v1
    model: auto/best-fast
    apiKeySecretRef:
      name: omniroute-secrets
      key: API_KEY_PRIMARY
    maxTokens: 4096
    temperature: 0.7
    timeoutSeconds: 120
  # No canary: the recorded heightfield runs already ARE the treatment arm, so
  # a canary would only re-measure what is known and spend the budget on it.
---
# Arm 1 -- isolates terrain geometry. Identical to the recorded spot stance runs
# except terrain=flat, where absolute height and terrain-relative height are the
# same quantity by construction.
apiVersion: research.nixlab.io/v1alpha1
kind: Experiment
metadata:
  name: spot-stance-flat-control
  namespace: apps
  labels:
    research.nixlab.io/curriculum-robot: spot
    research.nixlab.io/purpose: defect
spec:
  campaignRef: spot-stance-fall-detector
  hypothesis: >-
    Spot's eval_stance_score of 0.000 is caused by the absolute-height fall
    criterion terminating an upright robot on non-flat ground, not by an
    inability to stand. On terrain=flat, where absolute and terrain-relative
    height coincide, eval_fall_rate will drop below 1.00 and eval_stance_score
    will exceed 0.000 under otherwise identical settings. If flat still yields
    fall_rate 1.00, terrain is exonerated and the cause is either the 10-step
    settle window that sets _stand_height or spot's own dynamics.
  lineage:
    generation: 0
    relation: Baseline
    strategy: heuristic
  parameters:
    experimentIteration: 0
    mode: stance
    robot: spot
    terrain: flat
    terrain_difficulty: 0.0
    rig_carry: 0.5
    max_time: 8
    total_timesteps: 400000
---
# Arm 2 -- separates terrain TYPE from terrain AMPLITUDE. Same heightfield code
# path as the failing runs, but flattened. If arm 1 passes and this one fails,
# the fault is in the heightfield sampling rather than in surface relief.
apiVersion: research.nixlab.io/v1alpha1
kind: Experiment
metadata:
  name: spot-stance-heightfield-zero-relief
  namespace: apps
  labels:
    research.nixlab.io/curriculum-robot: spot
    research.nixlab.io/purpose: defect
spec:
  campaignRef: spot-stance-fall-detector
  hypothesis: >-
    If terrain relief is the cause, the heightfield path at
    terrain_difficulty=0.0 behaves like flat ground and eval_fall_rate falls
    below 1.00. If this arm still terminates every episode while terrain=flat
    does not, the defect is in heightfield height sampling at the spawn point
    (the robot is measured against a surface it is not standing on) rather than
    in relief amplitude.
  lineage:
    generation: 0
    relation: Baseline
    strategy: heuristic
  parameters:
    experimentIteration: 1
    mode: stance
    robot: spot
    terrain: heightfield
    terrain_difficulty: 0.0
    rig_carry: 0.5
    max_time: 8
    total_timesteps: 400000
---
# Arm 3 -- the rig. Added after arms 1 and 2 REFUTED the two hypotheses this
# campaign started with:
#
#   terrain:  spot-stance-flat-control ran on flat ground, where absolute and
#             terrain-relative height coincide by construction, and still
#             reported eval_fall_rate 1.00 with eval_upright_cos_mean 0.908 and
#             eval_episode_duration_s 1.40 of a max_time of 8.0. Terrain is
#             exonerated.
#   settle:   measured directly in-sim, _stand_height captured after the 10
#             settle steps is 0.2077 for spot against a converged rest of
#             0.2056 (snake 0.0052/-0.0000, spider 0.0639/0.0637), giving a
#             fall threshold of 0.1246 -- far below where the robot rests. The
#             10-step window is not truncating the capture. Holding the default
#             pose with zero action, spot never falls at all.
#
# So the env stands fine and the trained policy is what collapses. The
# remaining asymmetry is the sky-rig: training carries rig_carry of body weight
# while eval force-disarms it (eval_rig_assist_frac 0.0 in every run). If the
# policy never weaned, it learned to stand against a support that is absent
# when scored. Note the trained policy rests at eval_body_height_mean 0.285,
# ABOVE the 0.2056 default-pose rest -- it extends its legs past the height the
# reward references, which is what leaning on a tether would look like.
apiVersion: research.nixlab.io/v1alpha1
kind: Experiment
metadata:
  name: spot-stance-untethered-from-start
  namespace: apps
  labels:
    research.nixlab.io/curriculum-robot: spot
    research.nixlab.io/purpose: defect
spec:
  campaignRef: spot-stance-fall-detector
  hypothesis: >-
    Spot's eval_stance_score of 0.000 is rig dependence, not an inability to
    stand: the policy trains with rig_carry 0.5 of body weight and is scored
    with the rig disarmed, so it never learns to support itself. Training with
    rig_carry 0.0 from the start removes the train/eval mismatch entirely, so
    eval_fall_rate will drop below 1.00 and eval_episode_duration_s will exceed
    the 1.40 s seen in every tethered run. If it still falls at ~1.4 s
    untethered, the rig is exonerated too and the fault is in the stance reward
    or spot's own dynamics, since a zero-action PD hold provably does not fall.
  lineage:
    generation: 0
    relation: Baseline
    strategy: heuristic
  parameters:
    experimentIteration: 2
    mode: stance
    robot: spot
    terrain: flat
    terrain_difficulty: 0.0
    rig_carry: 0.0
    max_time: 8
    total_timesteps: 400000
