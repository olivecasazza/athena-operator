# ResearchDrive — the PERPETUAL research loop over Spot locomotion campaigns.
#
# A ResearchCampaign is a bounded search: it stops at budget.maxExperiments and
# never speaks again. The drive is the outer loop a human used to play by hand
# (v70 → v72 → v73 → v84 → v85 were all hand-created): when an owned campaign
# finishes, the drive folds its result (honest incumbentRemeasured objective,
# sigma-gated) into drive-level state, then asks the proposer LLM what to run
# next and creates the campaign itself. Campaigns form a DAG:
#
#   fork        — divergent theories run in parallel (≤ limits.maxActiveBranches)
#   consolidate — a new campaign seeded from a finished branch's winning
#                 experiment (spec.seedExperimentRef), so knowledge CONVERGES
#                 instead of every campaign cold-starting from template defaults
#
# The loop halts only on: spec.paused, the lifetime campaign cap, the
# stagnation window (N campaigns without a sigma-gated improvement → phase
# NeedsHuman), or a structural proposal awaiting human approval.
#
# Structural proposals (harness / rigging / sim-design changes) are RECORDED in
# status.proposals but never applied by the controller — it writes specs, not
# code. Under structuralChangePolicy: RequireApproval the drive parks in
# AwaitingApproval until:
#   kubectl annotate researchdrive spot-locomotion-drive \
#     research.nixlab.io/approve-proposal="<proposal-id>" --overwrite
---
apiVersion: research.nixlab.io/v1alpha1
kind: ResearchDrive
metadata:
  name: spot-locomotion-drive
  namespace: apps
spec:
  domain: spot-locomotion

  # Templates the proposer may launch campaigns against. The controller REJECTS
  # any proposal naming a template outside this list.
  templateRefs:
    - spot-walk-speed-v85
    - spot-forage-tyangpu-v84
    - spot-recover-mobile-kepler
    - spot-walk-pbt

  # Proposer: OpenAI-compatible endpoint. This one is OmniRoute (the cluster's
  # LLM gateway) — plain HTTP in-cluster, bearer key from the omniroute-secrets
  # Secret. External HTTPS providers work too (operator ships rustls).
  proposer:
    endpoint: http://omniroute.apps.svc.cluster.local:20128/v1
    model: auto/best-fast
    apiKeySecretRef:
      name: omniroute-secrets
      key: API_KEY_PRIMARY
    maxTokens: 4096
    temperature: 0.7
    timeoutSeconds: 120

  limits:
    # 2 branches on the hp pool (3 GPUs, 1 spare) + 1 on tyan01's Kepler pool
    # (7-GPU quota via athena-kepler; recover/balance templates run there).
    maxActiveBranches: 3
    # Lifetime campaign cap — reaching it parks the drive in NeedsHuman.
    maxCampaigns: 100
    # Per-campaign budget clamp: proposals can ask for less, never more.
    campaignBudget:
      maxExperiments: 12
      maxDuration: 48h

  # N consecutive campaigns without a sigma-gated improvement over the drive
  # best → phase NeedsHuman (the loop halts rather than burning budget on a
  # flat landscape).
  stagnation:
    window: 3

  # requireApproval: structural proposals park the drive until the approval
  # annotation lands. auto: recorded but never pause the loop.
  structuralChangePolicy: requireApproval

  paused: false
