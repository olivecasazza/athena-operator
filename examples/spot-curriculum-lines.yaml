  source:
    git:
      url: https://github.com/olivecasazza/skypilot-env
      ref: feat/spot-ground-speed-reward
  researchObjective: >-
    Curriculum stage 2 (locomotion) for the spider morphology.
    Seeded from this morphology's stance winner. Can a robot that can stand learn to track a commanded planar velocity and yaw rate across terrain? Selection is on integrated tracking score, which rewards tracking quality AND survival, rather than raw speed — which a diving policy maximizes.
  objective:
    metric: eval_track_score
    goal: maximize
  metrics:
    parser:
      type: file
      path: metrics.json
  # Pinned identity of this research line. Strings are never perturbed by a
  # search strategy, so these stay fixed while numeric knobs below are explored.
  defaults:
    robot: spider
    mode: locomotion
    terrain: mixed
  parameterSchema:
    rig_carry:
      type: number
      default: 0.0
      description: >-
        Fraction of body weight the elastic sky-rig carries, as a constant
        upward force. Annealed toward 0 in-env once an episode clears the
        upright competence gate, so this is the STARTING support, not a
        permanent crutch. Eval always runs at 0.
    terrain_difficulty:
      type: number
      default: 0.3
      description: Terrain roughness 0..1 for the shared terrain registry.
    max_time:
      type: number
      default: 12.0
      description: Episode length in seconds.
    total_timesteps:
      type: number
      default: 5000000
      description: Training budget in env steps.
  dashboard:
    title: "Curriculum 2/locomotion — spider"
    metrics:
      eval_upright_frac:
        label: Upright fraction, untethered eval
        unit: fraction
        goal: maximize
      eval_fall_rate:
        label: Fall rate, untethered eval
        unit: fraction
        goal: minimize
      eval_rig_assist_frac:
        label: Rig assist during eval (MUST be 0 — audit)
        unit: fraction
        goal: minimize
      reward_mean:
        label: Episode reward mean (diagnostic — farmable)
        unit: score
      eval_track_score:
        label: Command-tracking score (objective)
        unit: score
        goal: maximize
      eval_fwd_speed_mps:
        label: Realized speed along command
        unit: m/s
        goal: maximize

