      url: https://github.com/olivecasazza/skypilot-env
      ref: feat/spot-ground-speed-reward
  researchObjective: >-
    Curriculum stage 3 (forage) for the humanoid morphology.
    Seeded from this morphology's locomotion winner. Can a robot that can walk learn to SEEK — navigate to and collect battery waypoints? This is the last single-agent stage and the direct precursor to the arena, where seeking becomes pursuit (hunt) and its inverse becomes evasion.
  objective:
    metric: eval_collected
    goal: maximize
  metrics:
    parser:
      type: file
      path: metrics.json
  # Pinned identity of this research line. Strings are never perturbed by a
  # search strategy, so these stay fixed while numeric knobs below are explored.
  defaults:
    robot: humanoid
    mode: forage
    terrain: foraging
  parameterSchema:
    rig_carry:
      type: number
      default: 0.0
      description: >-
        Fraction of body weight the elastic sky-rig carries, as a constant
        upward force. Annealed toward 0 in-env once an episode clears the
        upright competence gate, so this is the STARTING support, not a
        permanent crutch. Eval always runs at 0.
    terrain_difficulty:
      type: number
      default: 0.3
      description: Terrain roughness 0..1 for the shared terrain registry.
    max_time:
      type: number
      default: 20.0
      description: Episode length in seconds.
    total_timesteps:
      type: number
      default: 5000000
      description: Training budget in env steps.
  dashboard:
    title: "Curriculum 3/forage — humanoid"
    metrics:
      eval_upright_frac:
        label: Upright fraction, untethered eval
        unit: fraction
        goal: maximize
      eval_fall_rate:
        label: Fall rate, untethered eval
        unit: fraction
        goal: minimize
      eval_rig_assist_frac:
        label: Rig assist during eval (MUST be 0 — audit)
        unit: fraction
        goal: minimize
      reward_mean:
        label: Episode reward mean (diagnostic — farmable)
        unit: score
      eval_collected:
        label: Batteries collected per episode (objective)
        unit: count
        goal: maximize
      eval_episode_duration_s:
        label: Episode duration, untethered eval
        unit: s

