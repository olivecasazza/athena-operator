# GENERATED by scripts/render-curriculum.py — edit that, not this file.
#
# 4 morphologies x 3 single-agent curriculum stages = 12 research lines,
# plus the canary-gated stage-1 campaigns that start the hierarchy.
# Requires examples/spot-curriculum.yaml (the shared RuntimeProfile).
---
apiVersion: research.nixlab.io/v1alpha1
kind: ExperimentTemplate
metadata:
  name: curriculum-spider-stance
  namespace: apps
  labels:
    research.nixlab.io/curriculum-robot: spider
    research.nixlab.io/curriculum-stage: stance
    research.nixlab.io/curriculum-order: "1"
spec:
  runtimeProfileRef: spot-curriculum-trainer
  source:
    git:
      url: https://github.com/olivecasazza/skypilot-env
      ref: feat/spot-ground-speed-reward
  researchObjective: >-
    Curriculum stage 1 (stance) for the spider morphology.
    Can this morphology hold a stable upright stance, and does an elastic sky-rig carrying part of its body weight get it there faster than unassisted training? Selection is on upright fraction measured with the rig DISARMED, so tethered standing earns nothing.
  objective:
    metric: eval_upright_frac
    goal: maximize
  metrics:
    parser:
      type: file
      path: metrics.json
  # Pinned identity of this research line. Strings are never perturbed by a
  # search strategy, so these stay fixed while numeric knobs below are explored.
  defaults:
    robot: spider
    mode: stance
    terrain: heightfield
  parameterSchema:
    rig_carry:
      type: number
      default: 0.5
      description: >-
        Fraction of body weight the elastic sky-rig carries, as a constant
        upward force. Annealed toward 0 in-env once an episode clears the
        upright competence gate, so this is the STARTING support, not a
        permanent crutch. Eval always runs at 0.
    terrain_difficulty:
      type: number
      default: 0.3
      description: Terrain roughness 0..1 for the shared terrain registry.
    max_time:
      type: number
      default: 8.0
      description: Episode length in seconds.
    total_timesteps:
      type: number
      default: 3000000
      description: Training budget in env steps.
  dashboard:
    title: "Curriculum 1/stance — spider"
    metrics:
      eval_upright_frac:
        label: Upright fraction, untethered eval
        unit: fraction
        goal: maximize
      eval_fall_rate:
        label: Fall rate, untethered eval
        unit: fraction
        goal: minimize
      eval_rig_assist_frac:
        label: Rig assist during eval (MUST be 0 — audit)
        unit: fraction
        goal: minimize
      reward_mean:
        label: Episode reward mean (diagnostic — farmable)
        unit: score
      eval_body_height_mean:
        label: Mean body height, untethered eval
        unit: m

