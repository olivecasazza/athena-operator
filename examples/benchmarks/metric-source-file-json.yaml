apiVersion: research.nixlab.io/v1alpha1
kind: MetricSource
metadata:
  name: file-metrics-json
spec:
  sourceType: file
  path: metrics.json
  format: json
  metrics:
    - name: val_bpb
      path: $.val_bpb
      type: number
      required: true
    - name: training_seconds
      path: $.training_seconds
      type: number
      required: true
    - name: total_seconds
      path: $.total_seconds
      type: number
      required: true
    - name: peak_vram_mb
      path: $.peak_vram_mb
      type: number
      required: true
    - name: mfu_percent
      path: $.mfu_percent
      type: number
      required: true
    - name: total_tokens
      path: $.total_tokens
      type: integer
      required: true
    - name: num_steps
      path: $.num_steps
      type: integer
      required: true
    - name: num_params
      path: $.num_params
      type: integer
      required: true
