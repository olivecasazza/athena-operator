# 72-hour multi-robot curriculum drive.
#
# The perpetual outer loop for the curriculum: when a campaign it owns reaches a
# terminal phase, the drive folds the result into its state, asks the proposer
# what to run next, and creates that campaign itself. Scoped to the 12
# curriculum research lines (4 morphologies x 3 stages), so it can advance a
# morphology from stance to locomotion to forage by pointing a new campaign's
# seedExperimentRef at the winning experiment of the prior stage — which
# warm-starts the weights, not just the parameters.
#
# STAGE GATING, enforced by the API rather than by prose: the controller
# REJECTS any proposal whose templateRef is not in `templateRefs`. So the
# allowlist below IS the current stage of the curriculum — while it holds only
# the stance templates, the proposer physically cannot start a locomotion or
# forage campaign for a morphology that has not passed stance. Widen it one
# stage at a time (or let the `curriculum` field do it once that lands on
# ResearchDriveSpec, which is the proper home for ordered stages).
#
# What is still NOT expressed in the API: automatic promotion. Deciding that
# "spider passed stance, so add curriculum-spider-locomotion" is a human edit
# today. That is the remaining gap between this manifest and the hierarchy the
# design law wants owned by a controller.
#
# Budget shape for a 72h window: 3 concurrent branches on the modern GPU pool
# (hp01-03 RTX 4000 + seir RTX 5000), each campaign capped at 12h and 6
# experiments, so a stalled line cannot eat the window. maxCampaigns 40 is a
# lifetime cap, not a target.
---
apiVersion: research.nixlab.io/v1alpha1
kind: ResearchDrive
metadata:
  name: multi-robot-curriculum-drive
  namespace: apps
spec:
  domain: multi-robot-curriculum

  # Outer bound. The CURRENT stage (spec.curriculum below) narrows this
  # further; the controller rejects any proposal outside the intersection.
  templateRefs:
    - curriculum-spider-stance
    - curriculum-snake-stance
    - curriculum-humanoid-stance
    - curriculum-spot-stance
    - curriculum-spider-locomotion
    - curriculum-snake-locomotion
    - curriculum-humanoid-locomotion
    - curriculum-spot-locomotion
    - curriculum-spider-forage
    - curriculum-snake-forage
    - curriculum-humanoid-forage
    - curriculum-spot-forage

  # The hierarchy, now an API invariant rather than prose: only the current
  # stage is proposable, and each stage seeds the next from its winner (which
  # carries WEIGHTS via seedExperimentRef -> ATHENA_RESUME_FROM).
  #
  # Promotion gates on SURVIVAL-COMPOSITE metrics. eval_upright_frac measures
  # orientation while alive, so a robot that stays vertical while its legs
  # crumple reads 1.000 while falling every episode (measured: spider,
  # humanoid and spot all did exactly that). eval_stance_score multiplies in
  # survival, so only genuine standing promotes.
  #
  # KNOWN LIMITATION: the stage is per-DRIVE, not per-morphology, so the whole
  # drive advances when the stage's BEST result passes. Today snake stands
  # (1.000) while spider/humanoid/spot score 0.000, so minExperiments is set
  # high enough that one morphology cannot drag the rest forward prematurely.
  # Per-morphology progression wants one drive per morphology (or a per-line
  # stage field); tracked, not pretended away.
  curriculum:
    stages:
      - name: stance
        templateRefs:
          - curriculum-spider-stance
          - curriculum-snake-stance
          - curriculum-humanoid-stance
          - curriculum-spot-stance
        promotion:
          metric: eval_stance_score
          threshold: 0.6
          minExperiments: 8
      - name: locomotion
        seedFrom: stance
        templateRefs:
          - curriculum-spider-locomotion
          - curriculum-snake-locomotion
          - curriculum-humanoid-locomotion
          - curriculum-spot-locomotion
        promotion:
          metric: eval_track_quality
          threshold: 25.0
          minExperiments: 8
      - name: forage
        seedFrom: locomotion
        templateRefs:
          - curriculum-spider-forage
          - curriculum-snake-forage
          - curriculum-humanoid-forage
          - curriculum-spot-forage
        promotion:
          metric: eval_collected
          threshold: 2.0
          minExperiments: 8

  proposer:
    endpoint: http://omniroute.apps.svc.cluster.local:20128/v1
    model: auto/best-fast
    apiKeySecretRef:
      name: omniroute-secrets
      key: API_KEY_PRIMARY
    maxTokens: 4096
    temperature: 0.7
    timeoutSeconds: 120

  limits:
    # 3 branches: enough to advance three morphologies in parallel while
    # leaving a GPU for the spot-locomotion drive and interactive work.
    maxActiveBranches: 3
    maxCampaigns: 40
    campaignBudget:
      maxExperiments: 6
      maxDuration: 12h

  # Stance is near-trivial for the statically stable morphologies (spider and
  # snake hold upright_frac 1.0 under random actions), so several consecutive
  # flat campaigns are EXPECTED early and a tight window would park the drive
  # immediately. 4 gives it room to move on to locomotion before giving up.
  stagnation:
    window: 4

  structuralChangePolicy: requireApproval
  paused: false
