# NOTE: the capacity-probe ResearchCampaign that once lived here was removed
# after the measurement was published as ResearchReport/tyan01-cpu-capacity.
# It is deliberately NOT kept in this file: re-applying the file to edit the
# profile silently RECREATED it and queued another 5 hours of tyan01 for an
# answered question. A one-shot probe campaign does not belong in a file that
# holds durable profiles/templates.
# tyan01 capacity probe: is the GPU actually load-bearing for this workload?
#
# tyan01 holds 8x GTX Titan Black (sm_35). Those GPUs CANNOT run the curriculum
# trainer: the image is CUDA 12.1 and CUDA 12 removed sm_35 entirely, while Ray
# 2.54.1's new-API RLModule stack needs torch 2.x, whose wheels ship no sm_35.
# Using them for GPU training means building torch from source against CUDA
# 11.4 -- and the one kepler image that exists in the registry
# (spot-rapier-trainer:v84-recover-kepler) has NO build recipe anywhere in the
# repo, so it is unreproducible.
#
# But the GPU may not matter here. The policy is a 256x256 MLP; the cost is
# rapier physics stepping, which is CPU work. The GPU profile already requests
# cpu: 8 -- the tell. If CPU-only on tyan01 lands within ~2x of the RTX 4000
# baseline (6k-14k steps/min measured across four morphologies), then tyan01
# adds real parallel capacity for the 4 workloads currently PENDING on
# athena-gpu, using the SAME image and no Kepler build at all.
#
# No queueName: this requests no nvidia.com/gpu, so Kueue GPU quota does not
# apply and labeling it would put CPU work in a GPU queue. tyan01 has 11
# allocatable CPU, so cpu:5 requests fit two concurrent experiments.
apiVersion: research.nixlab.io/v1alpha1
kind: RuntimeProfile
metadata:
  name: spot-curriculum-trainer-tyan-cpu
  namespace: apps
spec:
  # Identical digest to spot-curriculum-trainer. A different image would make
  # the throughput comparison meaningless.
  image: ghcr.io/olivecasazza/spot-rapier-trainer:curriculum-v5@sha256:8e985e18ee41c1686b63bd512d0bc7f15d9b8c2fe3753e2f55a3e1242a1f43f5
  imagePullSecrets:
    - name: ghcr-pull
  command: ["python3", "train_curriculum.py"]
  runtime:
    mode: batchJob
    type: pytorch
  env:
    - name: GCS_BUCKET
      value: nixlab-spot-reruns
    - name: GOOGLE_APPLICATION_CREDENTIALS
      value: /var/run/secrets/gcs/key.json
    - name: SPOT_ROBOT_ROOT
      value: /opt/robots
  # cpu: 8 of tyan01's 11 allocatable is deliberate ADMISSION CONTROL, not a
  # capacity estimate. A CPU-only profile carries no queueName (Kueue quota is
  # GPU-only), so nothing gates concurrency and the node WILL be oversubscribed
  # -- observed live: two experiments landed together and both dropped to
  # 1,364 steps/min against 9,827 solo. Sizing the request so only one pod
  # fits makes the kube-scheduler itself serialize them, with no new queue.
  # Lower this only alongside pinned torch/OMP thread counts.
  resources:
    requests:
      cpu: "8"
      memory: 8Gi
    limits:
      memory: 16Gi
  scheduling:
    nodeSelector:
      nixlab.io/gpu-arch: kepler
    # tyan01 carries BOTH taints; missing either leaves the pod unschedulable
    # with no GPU pressure to explain it.
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: nixlab.io/gpu-legacy
        operator: Exists
        effect: NoSchedule
  policy:
    allowCommandOverride: true
    allowImageOverride: false
    allowSecretRefs: false
  metricsEndpoint:
    enabled: true
    path: /metrics
    port: 9108
    prometheusQueryUrl: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
  secretMounts:
    - mountPath: /var/run/secrets/gcs/key.json
      secretName: spot-training-sa
      subPath: key.json
  storage:
    createWorkspaceClaim: false
    workspaceAccessModes: ["ReadWriteMany"]
    workspaceClaimName: athena-workspace
    workspaceMountPath: /workspace
    workspaceSize: 20Gi
    workspaceStorageClassName: nfs
---
# The profile is reachable only through a template, so the probe needs its own
# template + campaign. Same objective and defaults as curriculum-spot-stance;
# ONLY runtimeProfileRef differs, so the comparison isolates hardware.
#
# Deliberately absent from every ResearchDrive templateRefs allowlist: the
# curriculum drive must never propose campaigns onto a capacity probe.
apiVersion: research.nixlab.io/v1alpha1
kind: ExperimentTemplate
metadata:
  name: curriculum-spot-stance-tyan-cpu
  namespace: apps
  labels:
    research.nixlab.io/purpose: capacity-probe
spec:
  runtimeProfileRef: spot-curriculum-trainer-tyan-cpu
  researchObjective: >-
    Measure curriculum-trainer throughput on tyan01 with no GPU, against the
    11,393 steps/min RTX 4000 baseline, to decide whether tyan01's CPU is
    usable capacity for the workloads now pending on athena-gpu.
  objective:
    metric: eval_stance_score
    goal: maximize
  defaults:
    mode: stance
    robot: spot
    terrain: heightfield
    terrain_difficulty: 0.3
    rig_carry: 0.5
  metrics:
    parser:
      type: file
      path: metrics.json
  source:
    git:
      url: https://github.com/olivecasazza/skypilot-env
      ref: feat/spot-ground-speed-reward
---
# Drive-schedulable twin of the probe template. This one IS in the curriculum
# drive's stance allowlist, which turns tyan01 from idle into a fourth
# concurrent slot alongside hp01/hp02/hp03.
#
# Measured, not assumed: one experiment on tyan01 with no GPU sustains 9,827-
# 10,233 steps/min against an RTX 4000's 11,393 (0.86x). TWO concurrent
# experiments collapse to 1,364 each -- 2,728 aggregate, 3.7x WORSE than
# running one -- because torch sizes its thread pool to all 11 cores per
# process, so a second experiment thrashes rather than shares. Hence exactly
# one slot here; do not raise it without pinning thread counts first.
#
# Safe to compare against the GPU spot line: the campaign reconciler judges
# improvement WITHIN a template only, so this template forms its own sigma
# comparison group and slower hardware can never displace a GPU incumbent.
apiVersion: research.nixlab.io/v1alpha1
kind: ExperimentTemplate
metadata:
  name: curriculum-spot-stance-cpu
  namespace: apps
  labels:
    research.nixlab.io/curriculum-robot: spot
    research.nixlab.io/curriculum-stage: stance
spec:
  runtimeProfileRef: spot-curriculum-trainer-tyan-cpu
  researchObjective: >-
    Curriculum stage 1 (stance) for spot on CPU-only hardware. Exists to use
    tyan01's cores, whose 8 GTX Titan Blacks are sm_35 and cannot run the
    CUDA 12.1 trainer image at all. Same image, same objective, same defaults
    as curriculum-spot-stance; the GPU is worth roughly 10% on this workload.
  objective:
    metric: eval_stance_score
    goal: maximize
  defaults:
    mode: stance
    robot: spot
    terrain: heightfield
    terrain_difficulty: 0.3
    rig_carry: 0.5
  metrics:
    parser:
      type: file
      path: metrics.json
  source:
    git:
      url: https://github.com/olivecasazza/skypilot-env
      ref: feat/spot-ground-speed-reward
