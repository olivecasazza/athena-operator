# Athena canary test: exercises the full operator + training pipeline.
# Apply all four resources in order. The operator will provision a Job
# that runs canary_train.py and writes metrics.json to the workspace.
---
apiVersion: research.nixlab.io/v1alpha1
kind: RuntimeProfile
metadata:
  name: hp-8gb-canary
spec:
  runtime:
    type: pytorch
    mode: batchJob
  image: "python:3.11-slim"
  command: ["sh", "-c", "echo '[canary] running on python:3.11-slim'; pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu; python examples/canary/canary_train.py"]
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      nvidia.com/gpu: "1"
  storage:
    workspaceClaimName: "athena-workspace"
    workspaceMountPath: "/workspace"
  scheduling:
    nodeSelector:
      kubernetes.io/hostname: contra
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
---
apiVersion: research.nixlab.io/v1alpha1
kind: ExperimentTemplate
metadata:
  name: canary-template
spec:
  runtimeProfileRef: hp-8gb-canary
  source:
    git:
      url: "https://github.com/iii-experimental/n-autoresearch"
      ref: "main"
  objective:
    metric: "val_bpb"
    goal: "minimize"
  metrics:
    parser:
      type: "file"
      path: "metrics.json"
  parameterSchema:
    depth:
      type: integer
      default: 2
    deviceBatchSize:
      type: integer
      default: 4
    totalBatchSize:
      type: integer
      default: 1024
    timeBudget:
      type: integer
      default: 15
  dashboard:
    title: "Canary Run Dashboard"
    metrics:
      val_bpb:
        label: "Validation BPB"
      peak_vram_mb:
        label: "Peak VRAM (MB)"
---
apiVersion: research.nixlab.io/v1alpha1
kind: ResearchCampaign
metadata:
  name: canary-campaign
spec:
  templateRef: canary-template
  concurrency: 1
  budget:
    maxExperiments: 1
    maxDuration: "10m"
---
apiVersion: research.nixlab.io/v1alpha1
kind: Experiment
metadata:
  name: canary-run-02
spec:
  campaignRef: canary-campaign
  hypothesis: "Canary test using minimal depth and 15s budget to exercise operator and autoscaler."
  parameters:
    depth: 2
    deviceBatchSize: 4
    totalBatchSize: 1024
    timeBudget: 15
