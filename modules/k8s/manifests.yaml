ate(athena_operator_agent_action_total{namespace=~\"$namespace\"}[5m])) by (namespace,action,result)","legendFormat":"{{namespace}} {{action}} {{result}}"}],"title":"Agent action rate","type":"timeseries"},{"gridPos":{"h":8,"w":12,"x":12,"y":12},"id":8,"targets":[{"datasource":{"type":"prometheus"},"expr":"histogram_quantile(0.95, sum(rate(athena_operator_agent_action_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])) by (le,namespace,action))","legendFormat":"{{namespace}} {{action}}"}],"title":"p95 agent action latency","type":"timeseries"}],"refresh":"30s","schemaVersion":39,"tags":["athena","operator","research"],"templating":{"list":[{"current":{"text":"All","value":"$__all"},"datasource":{"type":"prometheus"},"includeAll":true,"name":"namespace","query":"label_values(athena_operator_reconcile_total, namespace)","refresh":1,"type":"query"},{"current":{"text":"All","value":"$__all"},"datasource":{"type":"prometheus"},"includeAll":true,"name":"experiment","query":"label_values(athena_operator_agent_action_total{namespace=~\"$namespace\"}, experiment)","refresh":1,"type":"query"}]},"time":{"from":"now-6h","to":"now"},"timezone":"browser","title":"Athena / Overview","uid":"athena-overview"}'
