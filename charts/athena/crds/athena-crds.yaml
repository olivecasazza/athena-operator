{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "researchcampaigns.research.nixlab.io"
  },
  "spec": {
    "group": "research.nixlab.io",
    "names": {
      "categories": [],
      "kind": "ResearchCampaign",
      "plural": "researchcampaigns",
      "shortNames": [
        "rcp"
      ],
      "singular": "researchcampaign"
    },
    "scope": "Namespaced",
    "versions": [
      {
        "additionalPrinterColumns": [
          {
            "jsonPath": ".spec.templateRef",
            "name": "Template",
            "type": "string"
          },
          {
            "jsonPath": ".status.runningExperiments",
            "name": "Running",
            "type": "integer"
          },
          {
            "jsonPath": ".status.succeededExperiments",
            "name": "Succeeded",
            "type": "integer"
          },
          {
            "jsonPath": ".metadata.creationTimestamp",
            "name": "Age",
            "type": "date"
          }
        ],
        "name": "v1alpha1",
        "schema": {
          "openAPIV3Schema": {
            "description": "Auto-generated derived type for ResearchCampaignSpec via `CustomResource`",
            "properties": {
              "spec": {
                "properties": {
                  "benchmarkRuntimeProfileRef": {
                    "description": "RuntimeProfile (BatchJob mode) the BenchmarkRun executes in. Required for benchmarking to actually run — an Experiment targetRef is not itself a RuntimeProfile, so the run can't fall back to it.",
                    "nullable": true,
                    "type": "string"
                  },
                  "benchmarkSuiteRef": {
                    "description": "Optional BenchmarkSuite to evaluate each succeeded experiment against. When set, the campaign creates a BenchmarkRun per succeeded experiment (targetRef = the Experiment) and DEFERS the Keep/Discard decision to the benchmark's gate results (via promotionPolicy.updateExperimentStatus) instead of stamping it from the raw training objective.",
                    "nullable": true,
                    "type": "string"
                  },
                  "budget": {
                    "default": {
                      "maxDuration": "24h",
                      "maxExperiments": 300
                    },
                    "properties": {
                      "maxDuration": {
                        "type": "string"
                      },
                      "maxExperiments": {
                        "format": "uint32",
                        "minimum": 0.0,
                        "type": "integer"
                      }
                    },
                    "required": [
                      "maxDuration",
                      "maxExperiments"
                    ],
                    "type": "object"
                  },
                  "canary": {
                    "description": "Optional canary stage: one cheap gate experiment generated before any budgeted experiments. Generation of further experiments is held until the canary succeeds AND (if a benchmark suite gates it) its gates pass.",
                    "nullable": true,
                    "properties": {
                      "benchmarkSuiteRef": {
                        "description": "Gate suite for the canary; falls back to the campaign's benchmarkSuiteRef. If neither is set, the gate is simply \"the canary experiment Succeeded\".",
                        "nullable": true,
                        "type": "string"
                      },
                      "maxDuration": {
                        "description": "Optional wall-clock bound for the canary. Recorded for runners/humans but NOT enforced by the controller yet — budget.maxDuration isn't enforced either, and the canary mirrors that mechanism rather than inventing a new one.",
                        "nullable": true,
                        "type": "string"
                      },
                      "parameters": {
                        "description": "Parameter overrides deep-merged over the template's default parameters (canary wins at any depth; arrays replace wholesale) for the canary experiment only. Typical use: {\"total_timesteps\": 2000000}.",
                        "x-kubernetes-preserve-unknown-fields": true
                      }
                    },
                    "type": "object"
                  },
                  "concurrency": {
                    "default": 0,
                    "format": "uint32",
                    "minimum": 0.0,
                    "type": "integer"
                  },
                  "inferenceCluster": {
                    "description": "Optional ephemeral MULTI-NODE inference cluster (vLLM tensor/pipeline parallel over Ray) for models too big for one GPU. The operator creates a Kueue-admitted RayJob (mesh-high priority → reclaims GPUs from spot) plus a stable head Service; experiments get `LLM_BASE_URL` injected and generation is gated on it serving. Torn down at terminal phase. Mutually exclusive with inferenceMesh (single-node); if both set, inferenceCluster wins.",
                    "nullable": true,
                    "properties": {
                      "dtype": {
                        "default": "float16",
                        "description": "vLLM dtype. Turing has no efficient bf16 → float16.",
                        "type": "string"
                      },
                      "extraArgs": {
                        "description": "Extra args appended to `vllm serve`.",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "gpuProduct": {
                        "default": "Quadro-RTX-4000",
                        "description": "nodeSelector `nvidia.com/gpu.product` value (the GPU pool to land on).",
                        "type": "string"
                      },
                      "image": {
                        "description": "vLLM OpenAI image (must bundle ray == rayVersion). e.g. vllm/vllm-openai:v0.6.6.post1",
                        "type": "string"
                      },
                      "maxModelLen": {
                        "default": 4096,
                        "description": "Max sequence length; bounded by per-GPU KV-cache headroom after weights.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "type": "integer"
                      },
                      "model": {
                        "description": "HF model ref (safetensors), e.g. deepseek-ai/DeepSeek-Prover-V2-7B.",
                        "type": "string"
                      },
                      "pipelineParallelSize": {
                        "description": "Total GPUs to split the model across (= pipeline-parallel-size). 1 head + (n-1) workers.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "type": "integer"
                      },
                      "port": {
                        "default": 8000,
                        "description": "OpenAI API port vLLM serves on.",
                        "format": "uint16",
                        "minimum": 0.0,
                        "type": "integer"
                      },
                      "priorityClass": {
                        "default": "mesh-high",
                        "description": "Kueue WorkloadPriorityClass — `mesh-high` preempts default-priority spot.",
                        "type": "string"
                      },
                      "queueName": {
                        "default": "athena-gpu",
                        "description": "Kueue LocalQueue name (maps to the GPU ClusterQueue).",
                        "type": "string"
                      },
                      "rayVersion": {
                        "default": "2.40.0",
                        "description": "Ray version — MUST match the ray bundled in `image` or GCS registration fails.",
                        "type": "string"
                      },
                      "runtimeClassName": {
                        "default": "nvidia",
                        "description": "runtimeClassName (nvidia on k3s GPU nodes).",
                        "type": "string"
                      },
                      "tolerations": {
                        "description": "Pod tolerations (raw JSON). Defaults to the nvidia GPU taint if empty.",
                        "x-kubernetes-preserve-unknown-fields": true
                      }
                    },
                    "required": [
                      "image",
                      "model",
                      "pipelineParallelSize"
                    ],
                    "type": "object"
                  },
                  "inferenceMesh": {
                    "description": "Optional ephemeral inference mesh (mesh-llm) brought up for the campaign's active lifetime and torn down when the campaign reaches terminal phase. While set, every experiment the campaign creates gets `LLM_BASE_URL` injected to point at the mesh Service, and experiment generation is gated on the mesh becoming Ready.",
                    "nullable": true,
                    "properties": {
                      "extraArgs": {
                        "description": "Extra args appended to `mesh-llm serve`.",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "gpuResources": {
                        "additionalProperties": {
                          "type": "string"
                        },
                        "description": "GPU resource requests/limits, e.g. {\"amd.com/gpu\": \"1\"} or {\"nvidia.com/gpu\": \"2\"}. Empty = CPU-only.",
                        "type": "object"
                      },
                      "image": {
                        "description": "Container image serving the mesh-llm OpenAI endpoint.",
                        "type": "string"
                      },
                      "model": {
                        "description": "Model to serve (mesh-llm catalog name, HF ref, or in-image path).",
                        "type": "string"
                      },
                      "nodeSelector": {
                        "additionalProperties": {
                          "type": "string"
                        },
                        "description": "nodeSelector for the mesh pod (e.g. pin to a specific host/pool).",
                        "type": "object"
                      },
                      "port": {
                        "default": 9337,
                        "description": "API port. mesh-llm defaults to 9337.",
                        "format": "uint16",
                        "minimum": 0.0,
                        "type": "integer"
                      },
                      "priorityClass": {
                        "default": "mesh-high",
                        "description": "Kueue WorkloadPriorityClass — `mesh-high` preempts default-priority spot.",
                        "type": "string"
                      },
                      "queueName": {
                        "default": "athena-gpu",
                        "description": "Kueue LocalQueue name (maps to the GPU ClusterQueue). Only stamped on the pod when `gpuResources` is non-empty — CPU-only meshes bypass Kueue.",
                        "type": "string"
                      },
                      "runtimeClassName": {
                        "description": "runtimeClassName (e.g. \"nvidia\"). Required for NVIDIA GPU pods on k3s.",
                        "nullable": true,
                        "type": "string"
                      },
                      "tolerations": {
                        "description": "Pod tolerations (raw JSON, mirrors SchedulingProfile.tolerations). json_value_schema is REQUIRED: schemars emits `items: {}` for serde_json::Value and the apiserver rejects untyped array items (caught live: helm CRD replace failed on this exact field).",
                        "x-kubernetes-preserve-unknown-fields": true
                      }
                    },
                    "required": [
                      "image",
                      "model"
                    ],
                    "type": "object"
                  },
                  "perturbFactor": {
                    "description": "Perturbation factor applied to hyperparameters during PBT exploit/explore.",
                    "format": "double",
                    "nullable": true,
                    "type": "number"
                  },
                  "populationSize": {
                    "description": "Population size for population-based training (PBT) strategies.",
                    "format": "uint32",
                    "minimum": 0.0,
                    "nullable": true,
                    "type": "integer"
                  },
                  "seedExperimentRef": {
                    "description": "Optional namespace-local Experiment to seed the search from. When set and no in-campaign best exists yet, the strategy perturbs from THAT experiment's spec.parameters instead of the template defaults, and (for PBT) warm-starts from its status.latestCheckpoint. This is how cross-campaign knowledge carries: a ResearchDrive consolidation campaign points here at the winning experiment of a prior branch so the new campaign continues from the incumbent rather than cold-starting.",
                    "nullable": true,
                    "type": "string"
                  },
                  "strategy": {
                    "default": {
                      "type": "heuristic"
                    },
                    "properties": {
                      "type": {
                        "type": "string"
                      }
                    },
                    "required": [
                      "type"
                    ],
                    "type": "object"
                  },
                  "templateRef": {
                    "type": "string"
                  }
                },
                "required": [
                  "templateRef"
                ],
                "type": "object"
              },
              "status": {
                "nullable": true,
                "properties": {
                  "bestExperiment": {
                    "nullable": true,
                    "type": "string"
                  },
                  "bestObjective": {
                    "description": "Best objective value observed across succeeded experiments (per the template objective goal).\n\nWARNING: this is the max over an increasing number of noisy draws, so it rises with experiment count even under zero true improvement. It is monotone BY CONSTRUCTION and is therefore not evidence of progress. Read `incumbent_remeasured` instead. See RQ5 in docs/selection-under-noise.md.",
                    "format": "double",
                    "nullable": true,
                    "type": "number"
                  },
                  "canaryExperiment": {
                    "description": "Name of the canary gate Experiment, once created (spec.canary only).",
                    "nullable": true,
                    "type": "string"
                  },
                  "canaryState": {
                    "description": "Canary gate state: \"pending\" | \"running\" | \"passed\" | \"failed\".",
                    "nullable": true,
                    "type": "string"
                  },
                  "controlRuns": {
                    "default": 0,
                    "description": "Control-slot runs completed so far (the sample behind `seed_noise_sigma`).",
                    "format": "uint32",
                    "minimum": 0.0,
                    "type": "integer"
                  },
                  "controllerVersion": {
                    "nullable": true,
                    "type": "string"
                  },
                  "failedExperiments": {
                    "format": "uint32",
                    "minimum": 0.0,
                    "type": "integer"
                  },
                  "incumbentRemeasured": {
                    "description": "Fresh-seed score of the current incumbent, from the per-generation control slot. Unlike `best_objective` this is an unbiased re-measurement and CAN go down, which is what makes it honest — report progress from this. Systematic divergence between the two IS the maximization bias, made directly visible.",
                    "format": "double",
                    "nullable": true,
                    "type": "number"
                  },
                  "observedGeneration": {
                    "format": "int64",
                    "nullable": true,
                    "type": "integer"
                  },
                  "phase": {
                    "description": "Loop phase: Running while generating/evaluating, Completed at budget.",
                    "nullable": true,
                    "type": "string"
                  },
                  "runningExperiments": {
                    "format": "uint32",
                    "minimum": 0.0,
                    "type": "integer"
                  },
                  "seedNoiseSigma": {
                    "description": "Live seed-noise estimate (sample sd) from repeated control-slot runs of the same incumbent config. Calibrates the selection threshold; None until at least two control runs have completed.",
                    "format": "double",
                    "nullable": true,
                    "type": "number"
                  },
                  "succeededExperiments": {
                    "format": "uint32",
                    "minimum": 0.0,
                    "type": "integer"
                  },
                  "totalExperiments": {
                    "default": 0,
                    "description": "Total experiments the campaign has generated so far.",
                    "format": "uint32",
                    "minimum": 0.0,
                    "type": "integer"
                  }
                },
                "required": [
                  "failedExperiments",
                  "runningExperiments",
                  "succeededExperiments"
                ],
                "type": "object"
              }
            },
            "required": [
              "spec"
            ],
            "title": "ResearchCampaign",
            "type": "object"
          }
        },
        "served": true,
        "storage": true,
        "subresources": {
          "status": {}
        }
      }
    ]
  }
}
