{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "experiments.research.nixlab.io"
  },
  "spec": {
    "group": "research.nixlab.io",
    "names": {
      "categories": [],
      "kind": "Experiment",
      "plural": "experiments",
      "shortNames": [
        "exp"
      ],
      "singular": "experiment"
    },
    "scope": "Namespaced",
    "versions": [
      {
        "additionalPrinterColumns": [
          {
            "jsonPath": ".status.phase",
            "name": "Phase",
            "type": "string"
          },
          {
            "jsonPath": ".status.decision",
            "name": "Decision",
            "type": "string"
          },
          {
            "jsonPath": ".metadata.creationTimestamp",
            "name": "Age",
            "type": "date"
          }
        ],
        "name": "v1alpha1",
        "schema": {
          "openAPIV3Schema": {
            "description": "Auto-generated derived type for ExperimentSpec via `CustomResource`",
            "properties": {
              "spec": {
                "properties": {
                  "campaignRef": {
                    "type": "string"
                  },
                  "checkpointPolicy": {
                    "nullable": true,
                    "properties": {
                      "intervalSeconds": {
                        "format": "uint64",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "resumeFrom": {
                        "nullable": true,
                        "type": "string"
                      },
                      "retain": {
                        "format": "uint32",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "env": {
                    "description": "Extra env vars merged into the job container AFTER the RuntimeProfile env, overriding same-named profile vars. The campaign controller uses this to inject `LLM_BASE_URL` for an ephemeral inference mesh.",
                    "items": {
                      "properties": {
                        "name": {
                          "type": "string"
                        },
                        "value": {
                          "nullable": true,
                          "type": "string"
                        }
                      },
                      "required": [
                        "name"
                      ],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "hypothesis": {
                    "type": "string"
                  },
                  "lineage": {
                    "description": "Structured record of WHY this experiment exists: which node it came from, by what operation, and what changed.\n\nBefore this field, the entire search decision lived in the free-text `hypothesis` string, and the parent pointer was smuggled into `parameters` as an untyped `parentExperimentId` entry that then had to be filtered back out in two independent places. Worse, the selection gate detected control runs by PREFIX-MATCHING the hypothesis prose — editing that string silently emptied the sigma sample and froze the incumbent forever with no error. Prose is not a type tag.\n\nDeliberately NOT an ownerReference: an ownerRef to the parent would cascade-delete an entire subtree when one node is removed. Lifecycle ownership belongs to the campaign; derivation is a plain reference.",
                    "nullable": true,
                    "properties": {
                      "generation": {
                        "description": "Generation index (idx / populationSize). Previously computed only to hash a seed and then discarded, so the tree had no depth coordinate.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "parent": {
                        "description": "Parent experiment name. None for a baseline/seed/canary with no parent.",
                        "nullable": true,
                        "type": "string"
                      },
                      "parentUid": {
                        "description": "Parent UID. Names are reused when a campaign is recreated; the UID makes a stale edge detectable rather than silently wrong.",
                        "nullable": true,
                        "type": "string"
                      },
                      "perturbations": {
                        "description": "Exactly what moved. Empty for a Remeasure/Replicate by definition.",
                        "items": {
                          "description": "One parameter's movement between parent and child.",
                          "properties": {
                            "factor": {
                              "description": "Multiplicative factor applied, when the operation was multiplicative.",
