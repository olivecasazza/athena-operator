          }
        ],
        "name": "v1alpha1",
        "schema": {
          "openAPIV3Schema": {
            "description": "Auto-generated derived type for ResearchReportSpec via `CustomResource`",
            "properties": {
              "spec": {
                "description": "A scientist's curation of a ResearchCampaign's results into a research-paper dataset. The **spec** is human/console-authored desired state (which experiments are included, narrative overrides, seeded hypotheses); the **status** is controller-owned (assembled dataset location, completeness).\n\nThe composed dossier is regenerable from spec at any time via `athena dossier --report <name>` or the console BFF, so v1 needs no reconciler — the durable product state is the curation spec.",
                "properties": {
                  "campaignRef": {
                    "description": "The ResearchCampaign whose experiments this report composes.",
                    "type": "string"
                  },
                  "excludedExperiments": {
                    "description": "Experiments to prune from the dataset by name (applied after inclusion).",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "includedExperiments": {
                    "description": "Experiments to include by name. Empty = every experiment in the campaign (minus `excludedExperiments`); the curator UI lists them all and the scientist prunes failed/unwanted runs via `excludedExperiments`. No phase filter is applied — inclusion is an explicit curation decision.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "references": {
                    "description": "Structured external citations. Narrative sections reference them inline as `[@key]`; the dossier renders a References section in both formats, and the reconciler surfaces cited-but-undefined / defined-but-uncited keys as conditions. Verification of the claims themselves is a separate adversarial audit workload, never self-asserted here.",
                    "items": {
                      "properties": {
                        "doi": {
                          "nullable": true,
                          "type": "string"
                        },
                        "key": {
                          "description": "Citation key used inline as `[@key]` in section text.",
                          "type": "string"
                        },
                        "supports": {
                          "description": "The specific claim in this report the source is cited to support — the unit the adversarial audit verifies.",
                          "nullable": true,
                          "type": "string"
                        },
                        "title": {
                          "type": "string"
                        },
                        "url": {
                          "nullable": true,
                          "type": "string"
                        }
                      },
                      "required": [
                        "key",
                        "title"
                      ],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "sections": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "description": "Scientist-authored narrative, keyed by section name (e.g. `relatedWork`, `limitations`, `discussion`). Rendered as extra sections in the dossier.",
