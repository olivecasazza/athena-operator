          }
        ],
        "name": "v1alpha1",
        "schema": {
          "openAPIV3Schema": {
            "description": "Auto-generated derived type for ResearchDriveSpec via `CustomResource`",
            "properties": {
              "spec": {
                "properties": {
                  "curriculum": {
                    "description": "Ordered training curriculum. When set, the drive may only launch campaigns against the CURRENT stage's templates (intersected with `templateRefs`), and advances a stage only when that stage's promotion criteria are met from campaign status.\n\nAbsent (the default) preserves the previous behaviour exactly: every template in `templateRefs` is proposable at any time. Without this the stage ORDER lives in proposer prose, which makes \"stance before locomotion\" a suggestion an LLM may ignore rather than an invariant the controller enforces.",
                    "nullable": true,
                    "properties": {
                      "stages": {
                        "default": [],
                        "description": "Stages in order. The first is entered on creation. Bounded by the CRD schema at 16 to keep status.stageHistory bounded too.",
                        "items": {
                          "properties": {
                            "name": {
                              "description": "Stable low-cardinality stage name (used in metrics labels and status).",
                              "type": "string"
                            },
                            "promotion": {
                              "description": "Criteria for leaving this stage. Absent means the stage never auto-promotes (a deliberate human gate).",
                              "nullable": true,
                              "properties": {
                                "metric": {
                                  "description": "Metric to gate on. MUST be a held-out metric: gating on a metric the reward optimizes promotes reward hacking.",
                                  "type": "string"
                                },
                                "minExperiments": {
                                  "default": 3,
                                  "description": "Minimum succeeded experiments in the stage before promotion may fire, so a single lucky run cannot advance the curriculum.",
                                  "format": "uint32",
                                  "minimum": 0.0,
                                  "type": "integer"
                                },
                                "threshold": {
                                  "description": "Objective value at or above which the stage counts as passed.",
                                  "format": "double",
                                  "type": "number"
                                }
                              },
                              "required": [
                                "metric",
                                "threshold"
                              ],
                              "type": "object"
                            },
                            "seedFrom": {
                              "description": "Name of an EARLIER stage whose winning experiment seeds campaigns in this stage (sets `spec.seedExperimentRef`, which carries both parameters and the checkpoint the runner warm-starts from). This is what makes the ordering pay for itself instead of each stage cold-starting.",
                              "nullable": true,
                              "type": "string"
                            },
                            "templateRefs": {
                              "default": [],
                              "description": "Templates proposable while this stage is current. Intersected with the drive's `templateRefs`, so the allowlist remains the outer bound.",
                              "items": {
                                "type": "string"
                              },
                              "type": "array"
                            }
                          },
                          "required": [
                            "name"
                          ],
                          "type": "object"
                        },
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "domain": {
                    "description": "Research domain label (e.g. \"spot-locomotion\"). Low-cardinality; used in metrics and proposer context.",
                    "type": "string"
                  },
                  "limits": {
                    "default": {
                      "campaignBudget": {
                        "maxDuration": "48h",
                        "maxExperiments": 12
                      },
                      "maxActiveBranches": 2,
                      "maxCampaigns": 100
                    },
                    "description": "Hard bounds the controller enforces on the drive regardless of what the proposer asks for.",
                    "properties": {
                      "campaignBudget": {
                        "default": {
                          "maxDuration": "48h",
                          "maxExperiments": 12
                        },
                        "description": "Per-campaign budget clamp: any proposed campaign's budget is reduced to at most these values before creation.",
                        "properties": {
                          "maxDuration": {
                            "type": "string"
                          },
                          "maxExperiments": {
                            "format": "uint32",
                            "minimum": 0.0,
                            "type": "integer"
                          }
                        },
                        "required": [
                          "maxDuration",
                          "maxExperiments"
                        ],
                        "type": "object"
                      },
                      "maxActiveBranches": {
                        "default": 2,
                        "description": "Maximum simultaneously-running campaigns the drive may own. Proposals beyond this are queued by deferral: the controller proposes again when a slot frees.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "type": "integer"
                      },
                      "maxCampaigns": {
                        "default": 100,
                        "description": "Lifetime campaign cap for the drive. Reaching it parks the drive in phase NeedsHuman (budget exhausted), not Failed.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "paused": {
                    "default": false,
                    "description": "Manual brake: while true the controller proposes and creates nothing.",
                    "type": "boolean"
                  },
                  "proposer": {
                    "description": "LLM proposer configuration. The controller calls this OpenAI-compatible endpoint when a campaign the drive owns reaches a terminal phase, asking for the next campaign(s) — the perpetual loop's hypothesis generator.",
                    "properties": {
                      "apiKeySecretRef": {
                        "description": "Optional Secret holding the API key. The key's value is sent as a Bearer token. Omit for unauthenticated in-cluster endpoints.",
                        "nullable": true,
                        "properties": {
                          "key": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "key",
                          "name"
                        ],
                        "type": "object"
                      },
                      "endpoint": {
                        "description": "Base URL of an OpenAI-compatible API (e.g. an in-cluster mesh-llm/vLLM Service or an external provider). The controller POSTs to `{endpoint}/chat/completions`.",
                        "type": "string"
                      },
                      "maxTokens": {
                        "description": "Max completion tokens per proposal call.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "model": {
                        "description": "Model identifier passed in the request body.",
                        "type": "string"
                      },
                      "temperature": {
                        "description": "Sampling temperature.",
                        "format": "double",
                        "nullable": true,
                        "type": "number"
                      },
                      "timeoutSeconds": {
                        "description": "HTTP timeout for one proposal call.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      }
                    },
                    "required": [
                      "endpoint",
                      "model"
                    ],
                    "type": "object"
                  },
                  "stagnation": {
                    "default": {
                      "window": 3
                    },
                    "description": "Stagnation policy: when the last `window` completed campaigns produced no sigma-gated improvement over the drive's best, the drive parks in phase NeedsHuman instead of proposing further.",
                    "properties": {
                      "window": {
                        "default": 3,
                        "description": "Number of consecutive completed campaigns without a sigma-gated improvement over the drive's bestObjective before the drive parks in NeedsHuman.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "structuralChangePolicy": {
                    "default": "requireApproval",
                    "description": "Gate for proposals that are NOT plain campaigns (harness, rigging, or sim-design changes). RequireApproval (default): the drive records the proposal in status.proposals and waits for the `research.nixlab.io/approve-proposal: \"<id>\"` annotation. Auto: structural proposals are still only RECORDED (the controller cannot apply code changes), but the drive keeps proposing/running campaigns without pausing.",
                    "enum": [
                      "requireApproval",
                      "auto"
                    ],
                    "type": "string"
                  },
                  "templateRefs": {
                    "description": "ExperimentTemplates the drive's proposer may launch campaigns against. The controller REJECTS any proposed campaign whose templateRef is not in this list. Minimum one entry.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": [
                  "domain",
                  "proposer",
                  "templateRefs"
                ],
                "type": "object"
              },
              "status": {
                "nullable": true,
                "properties": {
                  "bestExperimentRef": {
                    "description": "<experiment-name> holding the drive-level best objective.",
                    "nullable": true,
                    "type": "string"
                  },
                  "bestObjective": {
                    "description": "Best sigma-gated objective observed across ALL campaigns of this drive. Unlike campaign-level bestObjective this only moves on re-measured (unbiased) improvements, so it is honest progress evidence.",
                    "format": "double",
                    "nullable": true,
                    "type": "number"
                  },
                  "bestTemplateRef": {
                    "description": "Template that produced the current drive-level best. Sigma-gated comparison only happens WITHIN a template — objectives from different templates are not comparable, so a campaign fold against a different template is recorded but never displaces the incumbent (cross-template synthesis is the proposer's job, not a raw number comparison).",
                    "nullable": true,
                    "type": "string"
                  },
                  "campaignsCompleted": {
                    "default": 0,
                    "description": "Lifetime campaigns completed under this drive.",
                    "format": "uint32",
                    "minimum": 0.0,
                    "type": "integer"
                  },
                  "conditions": {
                    "items": {
                      "properties": {
                        "lastTransitionTime": {
                          "nullable": true,
                          "type": "string"
                        },
                        "message": {
                          "nullable": true,
                          "type": "string"
                        },
                        "reason": {
                          "nullable": true,
                          "type": "string"
                        },
                        "status": {
                          "enum": [
                            "Unknown",
                            "True",
                            "False"
                          ],
                          "type": "string"
                        },
                        "type": {
                          "type": "string"
                        }
                      },
                      "required": [
                        "status",
                        "type"
                      ],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "controllerVersion": {
                    "nullable": true,
                    "type": "string"
                  },
                  "currentCampaigns": {
                    "default": [],
                    "description": "Campaigns the drive currently owns (live branches).\n\nDeliberately NOT `skip_serializing_if = \"Vec::is_empty\"`. The status is written with a MERGE patch, so an omitted field leaves the server's old value intact: skipping the empty vec meant the last branch could never be cleared, the folded campaign stayed \"listed\", and it was re-folded on every reconcile — inflating campaignsCompleted and stagnationCounter without bound (observed at 5.1M against a stagnation window of 3, which pins the drive permanently stagnant).",
                    "items": {
                      "description": "One campaign the drive currently owns (a live branch of the research DAG).",
                      "properties": {
                        "campaign": {
                          "description": "Name of the ResearchCampaign running this branch.",
                          "type": "string"
                        },
                        "forkedFrom": {
                          "description": "Campaign this branch forked from (None for root branches).",
                          "nullable": true,
                          "type": "string"
                        },
                        "name": {
                          "description": "Branch label (proposer-chosen theory name, e.g. \"gait-frequency\").",
                          "type": "string"
                        },
                        "templateRef": {
                          "description": "ExperimentTemplate the campaign runs against.",
                          "type": "string"
                        }
                      },
                      "required": [
                        "campaign",
                        "name",
                        "templateRef"
                      ],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "curriculum": {
                    "description": "Observed curriculum progress; present only when spec.curriculum is set.",
                    "nullable": true,
                    "properties": {
                      "currentStage": {
                        "description": "Name of the stage currently proposable. Empty until first reconcile.",
                        "nullable": true,
                        "type": "string"
                      },
                      "stageHistory": {
                        "default": [],
                        "description": "One record per stage entered, oldest first. Bounded by spec.stages.",
                        "items": {
                          "properties": {
                            "bestExperiment": {
                              "description": "Experiment that satisfied promotion; seeds the next stage.",
                              "nullable": true,
                              "type": "string"
                            },
                            "bestObjective": {
                              "format": "double",
                              "nullable": true,
                              "type": "number"
                            },
                            "enteredAt": {
                              "nullable": true,
                              "type": "string"
                            },
                            "name": {
                              "type": "string"
                            },
                            "promotedAt": {
                              "description": "Set when the stage's promotion criteria were met.",
                              "nullable": true,
                              "type": "string"
                            },
                            "succeededExperiments": {
                              "default": 0,
                              "description": "Succeeded experiments observed in this stage.",
                              "format": "uint32",
                              "minimum": 0.0,
                              "type": "integer"
                            }
                          },
                          "required": [
                            "name"
                          ],
                          "type": "object"
                        },
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "foldedCampaigns": {
                    "default": [],
                    "description": "Campaigns already folded into drive state, newest last (bounded ring).\n\nBelt-and-braces idempotency for the fold: membership in `currentCampaigns` alone made \"fold exactly once\" depend on a status write surviving, and when that write silently dropped the empty list the same campaign folded forever. An explicit ledger makes double-folding structurally impossible regardless of patch semantics.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "lastProposalAt": {
                    "description": "RFC 3339 timestamp of the last successful proposer call.",
                    "nullable": true,
                    "type": "string"
                  },
                  "observedGeneration": {
                    "format": "int64",
                    "nullable": true,
                    "type": "integer"
                  },
                  "phase": {
                    "description": "Loop lifecycle phase.",
                    "enum": [
                      "idle",
                      "campaignRunning",
                      "proposing",
                      "awaitingApproval",
                      "needsHuman",
                      "paused",
                      "failed"
                    ],
                    "nullable": true,
                    "type": "string"
                  },
                  "proposals": {
                    "description": "Bounded ring of proposer decisions (newest last, cap 10).",
                    "items": {
                      "description": "One proposer decision recorded in the drive's bounded history (cap 10; the controller drops the oldest entry when full).",
                      "properties": {
                        "campaignNames": {
                          "description": "Campaign names created from this proposal (empty for structural or rejected proposals).",
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "decision": {
                          "default": "accepted",
                          "description": "Decision state of this proposal.",
                          "enum": [
                            "accepted",
                            "rejected",
                            "awaitingApproval",
                            "approved",
                            "declined"
                          ],
                          "type": "string"
                        },
                        "id": {
                          "description": "Stable id assigned by the controller (proposal-<n>). Humans approve structural proposals via annotation `research.nixlab.io/approve-proposal: \"<id>\"`.",
                          "type": "string"
                        },
                        "summary": {
                          "description": "Proposer's one-paragraph hypothesis/rationale.",
                          "type": "string"
                        }
                      },
                      "required": [
                        "id",
                        "summary"
                      ],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "stagnationCounter": {
                    "default": 0,
                    "description": "Consecutive completed campaigns without a sigma-gated improvement. Reset to 0 on any accepted improvement.",
                    "format": "uint32",
                    "minimum": 0.0,
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": [
              "spec"
            ],
            "title": "ResearchDrive",
            "type": "object"
          }
        },
        "served": true,
        "storage": true,
        "subresources": {
          "status": {}
        }
      }
    ]
  }
}
