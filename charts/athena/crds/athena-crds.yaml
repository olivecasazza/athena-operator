---
{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "runtimeprofiles.research.nixlab.io"
  },
  "spec": {
    "group": "research.nixlab.io",
    "names": {
      "categories": [],
      "kind": "RuntimeProfile",
      "plural": "runtimeprofiles",
      "shortNames": [
        "rtp"
      ],
      "singular": "runtimeprofile"
    },
    "scope": "Namespaced",
    "versions": [
      {
        "additionalPrinterColumns": [
          {
            "jsonPath": ".spec.runtime.type",
            "name": "Runtime",
            "type": "string"
          },
          {
            "jsonPath": ".spec.runtime.mode",
            "name": "Mode",
            "type": "string"
          },
          {
            "jsonPath": ".status.ready",
            "name": "Ready",
            "type": "boolean"
          },
          {
            "jsonPath": ".metadata.creationTimestamp",
            "name": "Age",
            "type": "date"
          }
        ],
        "name": "v1alpha1",
        "schema": {
          "openAPIV3Schema": {
            "description": "Auto-generated derived type for RuntimeProfileSpec via `CustomResource`",
            "properties": {
              "spec": {
                "properties": {
                  "args": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "command": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "env": {
                    "description": "Plain name/value environment variables injected into the job container.",
                    "items": {
                      "properties": {
                        "name": {
                          "type": "string"
                        },
                        "value": {
                          "nullable": true,
                          "type": "string"
                        }
                      },
                      "required": [
                        "name"
                      ],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "image": {
                    "type": "string"
                  },
                  "imagePullSecrets": {
                    "description": "Image pull secrets for private registries.",
                    "items": {
                      "properties": {
                        "name": {
                          "type": "string"
                        },
                        "namespace": {
                          "nullable": true,
                          "type": "string"
                        }
                      },
                      "required": [
                        "name"
                      ],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "metricsEndpoint": {
                    "default": {
                      "enabled": true,
                      "path": "/metrics",
                      "port": 9108
                    },
                    "description": "Live metrics integration for experiment Jobs.\n\nThe operator injects the scrape `port`/`path` and (optionally) a Prometheus query URL into each experiment pod, so training code can transparently *store* metrics (expose them for scrape) and *retrieve* them for live display (query Prometheus) during a run. A chart-rendered `PodMonitor` selects pods labelled `app.kubernetes.io/name=athena-experiment` and scrapes `port`; the cluster Prometheus discovers it (empty podMonitorSelector).\n\n`metrics.json` in the workspace remains the authoritative final summary; Prometheus is additive live data, not a replacement. Retrieval that feeds a control-flow decision must read authoritative CR status / artifacts instead.",
                    "properties": {
                      "enabled": {
                        "default": true,
                        "description": "Expose live metrics for scraping (default true).",
                        "type": "boolean"
                      },
                      "path": {
                        "default": "/metrics",
                        "description": "HTTP path the metrics are served at.",
                        "type": "string"
                      },
                      "port": {
                        "default": 9108,
                        "description": "Port the experiment exposes Prometheus-text metrics on.",
                        "format": "int32",
                        "type": "integer"
                      },
                      "prometheusQueryUrl": {
                        "description": "Prometheus HTTP query base URL injected for in-job display retrieval (e.g. `http://prometheus-operated.monitoring.svc:9090`). When unset the retrieve-for-display path is disabled in the job.",
                        "nullable": true,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "policy": {
                    "default": {
                      "allowCommandOverride": false,
                      "allowImageOverride": false,
                      "allowSecretRefs": false
                    },
                    "properties": {
                      "allowCommandOverride": {
                        "type": "boolean"
                      },
                      "allowImageOverride": {
                        "type": "boolean"
                      },
                      "allowSecretRefs": {
                        "type": "boolean"
                      }
                    },
                    "required": [
                      "allowCommandOverride",
                      "allowImageOverride",
                      "allowSecretRefs"
                    ],
                    "type": "object"
                  },
                  "pullPolicy": {
                    "nullable": true,
                    "type": "string"
                  },
                  "resources": {
                    "default": {},
                    "properties": {
                      "limits": {
                        "additionalProperties": {
                          "type": "string"
                        },
                        "type": "object"
                      },
                      "requests": {
                        "additionalProperties": {
                          "type": "string"
                        },
                        "type": "object"
                      }
                    },
                    "type": "object"
                  },
                  "runtime": {
                    "properties": {
                      "config": {
                        "additionalProperties": true,
                        "type": "object"
                      },
                      "mode": {
                        "enum": [
                          "batchJob",
                          "service",
                          "externalJob"
                        ],
                        "type": "string"
                      },
                      "type": {
                        "enum": [
                          "pytorch",
                          "mlx",
                          "ollama",
                          "vllm",
                          "llamaCpp",
                          "skypilot",
                          "modal",
                          "custom"
                        ],
                        "type": "string"
                      }
                    },
                    "required": [
                      "mode",
                      "type"
                    ],
                    "type": "object"
                  },
                  "scheduling": {
                    "default": {},
                    "properties": {
                      "nodeSelector": {
                        "additionalProperties": {
                          "type": "string"
                        },
                        "type": "object"
                      },
                      "priorityClassName": {
                        "nullable": true,
                        "type": "string"
                      },
                      "queueName": {
                        "description": "Kueue LocalQueue (in the Job's namespace) to submit this experiment's Job to. When set, the operator stamps the `kueue.x-k8s.io/queue-name` label and creates the Job suspended, so Kueue admits it against the queue's quota. Unset → Jobs schedule directly, no Kueue involvement.",
                        "nullable": true,
                        "type": "string"
                      },
                      "runtimeClassName": {
                        "description": "Container runtime class for the experiment pods (e.g. `nvidia` on k3s nodes where the NVIDIA runtime is not containerd's default — without it the pod gets the GPU resource but no driver).",
                        "nullable": true,
                        "type": "string"
                      },
                      "tolerations": {
                        "x-kubernetes-preserve-unknown-fields": true
                      }
                    },
                    "type": "object"
                  },
                  "secretMounts": {
                    "description": "Secrets mounted as files (e.g. a GCS service-account key).",
                    "items": {
                      "properties": {
                        "mountPath": {
                          "type": "string"
                        },
                        "secretName": {
                          "type": "string"
                        },
                        "subPath": {
                          "nullable": true,
                          "type": "string"
                        }
                      },
                      "required": [
                        "mountPath",
                        "secretName"
                      ],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "sky": {
                    "description": "Optional SkyPilot cloud-burst layer. Absent = on-prem Kubernetes Job (today's behavior). Present + enabled = the operator builds a small launcher Job that renders a sky task from the experiment (same image / command / env the k8s path would use) and runs `sky launch` — the chain is sky -> kueue -> ray -> experiment: the LAUNCHER Job (not the cloud node) is what Kueue admits, so cloud bursts still flow through quota accounting. Quota then represents \"concurrent experiments\", not local GPUs — intended.",
                    "nullable": true,
                    "properties": {
                      "accelerators": {
                        "description": "SkyPilot accelerator string, e.g. `A10:8`. Unset = CPU-only task.",
                        "nullable": true,
                        "type": "string"
                      },
                      "cloud": {
                        "description": "Optional cloud pin (e.g. `gcp`). Unset = SkyPilot's ordered/cheapest.",
                        "nullable": true,
                        "type": "string"
                      },
                      "enabled": {
                        "default": true,
                        "description": "Burst this profile's experiments to the cloud (default true when the block is present; the block being absent is the on-prem switch).",
                        "type": "boolean"
                      },
                      "envSecretRef": {
                        "description": "Secret (in the Job's namespace) whose keys are injected as env vars into the launcher container for sky CLI cloud credentials.",
                        "nullable": true,
                        "type": "string"
                      },
                      "idleMinutesToAutostop": {
                        "description": "`sky launch --idle-minutes-to-autostop` window.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "ttlMinutes": {
                        "description": "Hard autostop/teardown in minutes — the launcher tears the cluster down unconditionally once this elapses, even if the task hangs.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "useSpot": {
                        "default": true,
                        "description": "Use spot/preemptible instances.",
                        "type": "boolean"
                      }
                    },
                    "type": "object"
                  },
                  "storage": {
                    "default": {
                      "createWorkspaceClaim": true,
                      "workspaceAccessModes": [
                        "ReadWriteOnce"
                      ],
                      "workspaceClaimName": "athena-workspace",
                      "workspaceMountPath": "/workspace",
                      "workspaceSize": "20Gi"
                    },
                    "properties": {
                      "createWorkspaceClaim": {
                        "default": true,
                        "type": "boolean"
                      },
                      "workspaceAccessModes": {
                        "default": [
                          "ReadWriteOnce"
                        ],
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "workspaceClaimName": {
                        "type": "string"
                      },
                      "workspaceMountPath": {
                        "type": "string"
                      },
                      "workspaceSize": {
                        "default": "20Gi",
                        "type": "string"
                      },
                      "workspaceStorageClassName": {
                        "nullable": true,
                        "type": "string"
                      }
                    },
                    "required": [
                      "workspaceClaimName",
                      "workspaceMountPath"
                    ],
                    "type": "object"
                  }
                },
                "required": [
                  "image",
                  "runtime"
                ],
                "type": "object"
              },
              "status": {
                "nullable": true,
                "properties": {
                  "message": {
                    "nullable": true,
                    "type": "string"
                  },
                  "ready": {
                    "type": "boolean"
                  }
                },
                "required": [
                  "ready"
                ],
                "type": "object"
              }
            },
            "required": [
              "spec"
            ],
            "title": "RuntimeProfile",
            "type": "object"
          }
        },
        "served": true,
        "storage": true,
        "subresources": {
          "status": {}
        }
      }
    ]
  }
}
