  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "researchreports.research.nixlab.io"
  },
  "spec": {
    "group": "research.nixlab.io",
    "names": {
      "categories": [],
      "kind": "ResearchReport",
      "plural": "researchreports",
      "shortNames": [
        "rrp"
      ],
      "singular": "researchreport"
    },
    "scope": "Namespaced",
    "versions": [
      {
        "additionalPrinterColumns": [
          {
            "jsonPath": ".spec.campaignRef",
            "name": "Campaign",
            "type": "string"
          },
          {
            "jsonPath": ".status.phase",
            "name": "Phase",
            "type": "string"
          },
          {
            "jsonPath": ".metadata.creationTimestamp",
            "name": "Age",
            "type": "date"
          }
        ],
        "name": "v1alpha1",
        "schema": {
          "openAPIV3Schema": {
            "description": "Auto-generated derived type for ResearchReportSpec via `CustomResource`",
            "properties": {
              "spec": {
                "description": "A scientist's curation of a ResearchCampaign's results into a research-paper dataset. The **spec** is human/console-authored desired state (which experiments are included, narrative overrides, seeded hypotheses); the **status** is controller-owned (assembled dataset location, completeness).\n\nThe composed dossier is regenerable from spec at any time via `athena dossier --report <name>` or the console BFF, so v1 needs no reconciler — the durable product state is the curation spec.",
                "properties": {
                  "about": {
                    "description": "What this document is ABOUT, when it is narrower than the whole campaign.\n\nA report could previously only bind to a `campaignRef`, so there was no way to attach an analysis to one experiment or to a branch of the search tree — every document was campaign-wide. Pointing `about` at an Experiment scopes the dossier to that node and its DESCENDANTS via `spec.lineage`, which is what makes \"write up this branch\" expressible.\n\n`motivation` follows the W3C Web Annotation vocabulary, so the reason a document is attached is itself typed rather than implied.",
                    "nullable": true,
                    "properties": {
                      "kind": {
                        "description": "Kind of the subject — `Experiment` or `ResearchCampaign`.",
                        "type": "string"
                      },
                      "motivation": {
                        "description": "Why a document is attached to its subject.\n\nBorrowed from the W3C Web Annotation Data Model's motivation vocabulary (`oa:describing`, `oa:assessing`, ...), so an offhand note and a formal assessment are distinguishable instead of both being \"a report\".",
                        "enum": [
                          "Describing",
                          "Assessing",
                          "Questioning",
                          "Commenting"
                        ],
                        "nullable": true,
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      }
                    },
                    "required": [
                      "kind",
                      "name"
                    ],
                    "type": "object"
                  },
                  "campaignRef": {
                    "description": "The ResearchCampaign whose experiments this report composes.",
                    "type": "string"
                  },
                  "excludedExperiments": {
                    "description": "Experiments to prune from the dataset by name (applied after inclusion).",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "includedExperiments": {
                    "description": "Experiments to include by name. Empty = every experiment in the campaign (minus `excludedExperiments`); the curator UI lists them all and the scientist prunes failed/unwanted runs via `excludedExperiments`. No phase filter is applied — inclusion is an explicit curation decision.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "references": {
                    "description": "Structured external citations. Narrative sections reference them inline as `[@key]`; the dossier renders a References section in both formats, and the reconciler surfaces cited-but-undefined / defined-but-uncited keys as conditions. Verification of the claims themselves is a separate adversarial audit workload, never self-asserted here.",
                    "items": {
                      "properties": {
                        "doi": {
                          "nullable": true,
                          "type": "string"
                        },
                        "key": {
                          "description": "Citation key used inline as `[@key]` in section text.",
                          "type": "string"
                        },
                        "supports": {
                          "description": "The specific claim in this report the source is cited to support — the unit the adversarial audit verifies.",
                          "nullable": true,
                          "type": "string"
                        },
                        "title": {
                          "type": "string"
                        },
                        "url": {
                          "nullable": true,
                          "type": "string"
                        }
                      },
                      "required": [
                        "key",
                        "title"
                      ],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "sections": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "description": "Scientist-authored narrative, keyed by section name (e.g. `relatedWork`, `limitations`, `discussion`). Rendered as extra sections in the dossier.",
                    "type": "object"
                  },
                  "seededHypotheses": {
                    "description": "Hypotheses the scientist wants recorded for follow-up — surfaced as a \"Seeded Hypotheses / Future Work\" section. (This does NOT launch experiments; it is report content.)",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "title": {
                    "description": "Paper title. Falls back to a generated title when unset.",
                    "nullable": true,
                    "type": "string"
                  }
                },
                "required": [
                  "campaignRef"
                ],
                "type": "object"
              },
              "status": {
                "nullable": true,
                "properties": {
                  "conditions": {
                    "description": "Bounded conditions (reuses the shared condition shape), e.g. `MissingProvenance`, `CampaignResolved`.",
                    "items": {
                      "properties": {
                        "lastTransitionTime": {
                          "nullable": true,
                          "type": "string"
                        },
                        "message": {
                          "nullable": true,
                          "type": "string"
                        },
                        "reason": {
                          "nullable": true,
                          "type": "string"
                        },
                        "status": {
                          "nullable": true,
                          "type": "string"
                        },
                        "type": {
                          "nullable": true,
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "nullable": true,
                    "type": "array"
                  },
                  "controllerVersion": {
                    "nullable": true,
                    "type": "string"
                  },
                  "datasetUri": {
                    "description": "Location of the assembled dataset bundle once a reconciler persists it.",
                    "nullable": true,
                    "type": "string"
                  },
                  "includedCount": {
                    "description": "Number of experiments in the composed dataset after curation.",
                    "format": "uint32",
                    "minimum": 0.0,
                    "nullable": true,
                    "type": "integer"
                  },
                  "lastAssembledTime": {
                    "nullable": true,
                    "type": "string"
                  },
                  "observedGeneration": {
                    "format": "int64",
                    "nullable": true,
                    "type": "integer"
                  },
                  "phase": {
                    "description": "Lifecycle phase, e.g. `Draft` / `Assembled`. Controller-owned (phase 2).",
                    "nullable": true,
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": [
              "spec"
            ],
            "title": "ResearchReport",
