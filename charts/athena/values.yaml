auth:
  oidc:
    adminGroup: athena:admin
    enabled: true
    groupsClaim: groups
    issuerURL: https://auth.casazza.io/realms/master
    operatorGroup: athena:operator
    usernameClaim: email
    viewerGroup: athena:viewer
  rbac:
    adminClusterRoleName: athena-admin
    adminGroupName: athena:admin
    create: true
    operatorClusterRoleName: athena-operator-role
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/olivecasazza/athena-operator
  tag: ''
metrics:
  enabled: true
  port: 8080
  serviceMonitor:
    enabled: true
    interval: 15s
observability:
  grafanaDashboard:
    enabled: true
replicaCount: 1
resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
serviceAccount:
  create: true
  name: athena-operator
