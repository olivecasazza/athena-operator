auth:
  oidc:
    adminGroup: athena:admin
    enabled: true
    groupsClaim: groups
    issuerURL: https://auth.casazza.io/realms/master
    operatorGroup: athena:operator
    usernameClaim: email
    viewerGroup: athena:viewer
  rbac:
    adminClusterRoleName: athena-admin
    adminGroupName: athena:admin
    create: true
    operatorClusterRoleName: athena-operator-role
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/olivecasazza/athena-operator
  tag: ''
imagePullSecrets:
- name: ghcr-pull
metrics:
  enabled: true
  port: 8080
  serviceMonitor:
    enabled: true
    interval: 15s
observability:
  grafanaDashboard:
    enabled: true
replicaCount: 1
resources:
  # 256Mi/128Mi OOM-killed the operator on a cluster with ~25 ResearchCampaigns
  # and several hundred Experiments: a kube-rs controller caches every watched
  # object, so footprint scales with object count rather than activity.
  limits:
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi
serviceAccount:
  create: true
  name: athena-operator
