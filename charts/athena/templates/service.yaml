apiVersion: v1
kind: Service
metadata:
  name: {{ include "athena.fullname" . }}-metrics
  labels:
    {{- include "athena.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "athena.selectorLabels" . | nindent 4 }}
