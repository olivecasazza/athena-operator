# Harness proposer Jobs (drive spec.proposer.harness) execute model-generated
# Python. Default-deny: no ingress; egress only to DNS, the model gateway,
# the protected Athena MCP endpoint and Keycloak's token endpoint. The
# Kubernetes API and unrelated services remain unreachable from the agent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: athena-proposer-harness
  labels:
    app.kubernetes.io/name: athena
spec:
  podSelector:
    matchLabels:
      athena.nixlab.io/role: proposer-harness
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: omniroute
      ports:
        - protocol: TCP
          port: 20128
    - to:
        - podSelector:
            matchLabels:
              mcp-server: athena-console
      ports:
        - protocol: TCP
          port: 3000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth
          podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8080
