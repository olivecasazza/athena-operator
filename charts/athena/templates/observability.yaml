    app.kubernetes.io/name: athena
    app.kubernetes.io/version: 0.1.5
    helm.sh/chart: athena-0.1.5
  name: athena
spec:
  endpoints:
    - interval: 15s
      port: metrics
  selector:
    matchLabels:
      app.kubernetes.io/instance: athena
      app.kubernetes.io/name: athena
